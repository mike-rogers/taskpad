name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (ESP-IDF v6.0, esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32c3
          command: >-
            idf.py build &&
            cd build &&
            esptool.py --chip esp32c3 merge_bin -o taskpad-factory.bin @flash_args

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/taskpad.bin
            build/taskpad-factory.bin

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/taskpad.bin
            build/taskpad-factory.bin
